<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saygınlar Transport - Gallery</title><link rel="stylesheet" href="style.css"><script src="site.js"></script>
</head>
<body>
<div style="padding:50px 5% 80px">
<h1 class="title">COMPANY <b>GALLERY</b></h1>
<p class="subtitle">"Scenes from the asphalt - Saygınlar Transport convoy fleet on the road."</p>
<div class="adm" id="adm" style="display:none">
  <b><span class="tr">+ YENİ FOTOĞRAF EKLE</span><span class="en">+ ADD NEW PHOTO</span></b>
  <div id="drop"></div>
  <input id="u" data-ph-tr="ya da fotoğraf URL'si (https://...)" data-ph-en="or image URL (https://...)">
  <button class="btn" id="add"><span class="tr">EKLE</span><span class="en">ADD</span></button>
  <div id="m"></div>
</div>
<div class="gal" id="gal">
<div><img loading="lazy" src="https://i.hizliresim.com/br864fb.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/ei9vibu.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/silde2u.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/t4pyhrz.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/gy920ru.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/pyxcgl8.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/blw39go.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/t2wvq1t.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/oo8uzu9.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/xgt88x6.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/78rgent.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/jbt8f6r.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/61gswph.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/nnwytxj.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/e7jjnk2f.png" alt="Saygınlar Convoy"></div>
<div><img loading="lazy" src="https://i.hizliresim.com/giiydp9e.png" alt="Saygınlar Convoy"></div>
</div></div>
<footer>&copy; 2026 Saygınlar Transport. All Rights Reserved.</footer>
<script type="module">
import {makeDrop} from "./upload.js";
import {db,collection,getDocs,query,orderBy,addDoc,deleteDoc,doc,serverTimestamp,watchRole,isAdminRole} from "./fb.js";
const $=id=>document.getElementById(id);let admin=false;
const drop=makeDrop($('drop'),1280);
const ok=u=>/^(https:\/\/|data:image\/jpeg;base64,).+/.test(u);
function note(t,err){$('m').innerHTML='';const d=document.createElement('div');d.className='msg'+(err?' err':'');d.textContent=t;$('m').append(d);}
let seq=0;
async function load(){
  const my=++seq;
  document.querySelectorAll('#gal .dyn').forEach(e=>e.remove());
  try{
    const s=await getDocs(query(collection(db,'gallery'),orderBy('createdAt','asc')));
    if(my!==seq)return;
    s.forEach(d=>{
      const u=d.data().url;if(!ok(u))return;
      const c=document.createElement('div');c.className='dyn';
      const i=document.createElement('img');i.loading='lazy';i.src=u;i.alt='Saygınlar Convoy';c.append(i);
      if(admin){const x=document.createElement('button');x.className='xbtn';x.textContent='✕';
        x.onclick=async()=>{if(confirm(T('Silinsin mi?','Delete this?'))){await deleteDoc(doc(db,'gallery',d.id));load();}};c.append(x);}
      $('gal').append(c);
    });
  }catch(e){console.error(e);}
}
$('add').onclick=async()=>{
  const u=drop.getData()||$('u').value.trim();
  if(!ok(u)){note(T('Bir fotoğraf sürükle ya da geçerli bir https:// adresi gir.','Drag a photo or enter a valid https:// URL.'),true);return;}
  try{await addDoc(collection(db,'gallery'),{url:u,createdAt:serverTimestamp()});$('u').value='';drop.clear();note(T('Eklendi.','Added.'));load();}
  catch(e){note(T('Yetkin yok veya hata oluştu.','No permission or an error occurred.'),true);}
};
watchRole(r=>{admin=isAdminRole(r);$('adm').style.display=admin?'block':'none';load();});
</script></body></html>
