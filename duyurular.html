<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saygınlar Transport - Duyurular</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="box narrow">
  <h1 class="title"><span class="tr">DUYURU<b>LAR</b></span><span class="en">ANNOUNCE<b>MENTS</b></span></h1>
  <p class="subtitle"><span class="tr">"Saygınlar Transport'tan son haberler."</span><span class="en">"Latest news from Saygınlar Transport."</span></p>
  <div id="list"><div class="msg">...</div></div>
</div>
<script src="site.js"></script>
<script type="module">
import {db,collection,getDocs,query,orderBy} from "./fb.js";
const list=document.getElementById('list');
let rows=[];
function render(){
  list.innerHTML='';
  if(!rows.length){list.innerHTML='<div class="msg">'+bi('Henüz duyuru yok.','No announcements yet.')+'</div>';return;}
  rows.forEach(a=>{
    const el=document.createElement('div');el.className='ann';
    const h=document.createElement('h3');h.textContent=a.title;
    const s=document.createElement('small');s.textContent=a.createdAt?fmt(a.createdAt.toDate()):'';
    const p=document.createElement('p');p.textContent=a.content;
    el.append(h,s,p);
    if(a.imageUrl&&/^https:\/\//.test(a.imageUrl)){const i=document.createElement('img');i.src=a.imageUrl;i.alt=a.title;i.loading='lazy';el.append(i);}
    list.append(el);
  });
}
try{
  const snap=await getDocs(query(collection(db,"announcements"),orderBy("createdAt","desc")));
  rows=snap.docs.map(d=>d.data());render();
}catch(e){list.innerHTML='<div class="msg err">'+bi('Duyurular yüklenemedi.','Could not load announcements.')+'</div>';console.error(e);}
document.addEventListener('langchange',()=>{if(rows)render();});
</script></body></html>
