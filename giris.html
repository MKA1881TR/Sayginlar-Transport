<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saygınlar Transport - Giriş</title><link rel="stylesheet" href="style.css"><script src="site.js"></script>
</head>
<body>
<div class="box narrow" style="max-width:460px">
  <h1 class="title" style="font-size:34px"><span class="tr">HESAP <b>GİRİŞİ</b></span><span class="en">ACCOUNT <b>LOGIN</b></span></h1>
  <div class="tabs">
    <button class="btn gray" id="t-login" style="flex:1"><span class="tr">Giriş Yap</span><span class="en">Log in</span></button>
    <button class="btn gray" id="t-reg" style="flex:1"><span class="tr">Kayıt Ol</span><span class="en">Sign up</span></button>
  </div>
  <input type="email" id="email" data-ph-tr="E-posta" data-ph-en="Email" autocomplete="email">
  <input type="password" id="pass" data-ph-tr="Şifre (en az 6 karakter)" data-ph-en="Password (min 6 characters)" autocomplete="current-password">
  <label id="agree-row" style="display:none;gap:8px;align-items:flex-start;color:#ccc;font-size:13px;line-height:1.5;margin:4px 0 12px;cursor:pointer">
    <input type="checkbox" id="agree" style="width:auto;margin:3px 0 0">
    <span class="tr">En az 16 yaşında olduğumu, <a href="hizmet-sartlari.html" target="_blank" rel="noopener">Hizmet Şartları</a>'nı ve <a href="gizlilik.html" target="_blank" rel="noopener">Gizlilik Politikası</a>'nı okuyup kabul ettiğimi onaylıyorum.</span>
    <span class="en">I confirm that I am at least 16 years old and that I have read and accept the <a href="hizmet-sartlari.html" target="_blank" rel="noopener">Terms of Service</a> and the <a href="gizlilik.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
  </label>
  <button class="btn" id="go" style="width:100%"></button>
  <p style="text-align:center"><a href="#" id="reset"><span class="tr">Şifremi unuttum</span><span class="en">Forgot password</span></a></p>
  <div id="msg"></div>
</div>
<script type="module">
import {auth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,getRole,isStaffRole} from "./fb.js";
const $=id=>document.getElementById(id);let mode='login';
function say(t,err){$('msg').innerHTML='';const d=document.createElement('div');d.className='msg'+(err?' err':'');d.textContent=t;$('msg').append(d);}
function setMode(m){mode=m;$('go').innerHTML=m==='login'?bi('GİRİŞ YAP','LOG IN'):bi('KAYIT OL','SIGN UP');
  $('t-login').style.background=m==='login'?'#cc0000':'#444';$('t-reg').style.background=m==='reg'?'#cc0000':'#444';
  $('agree-row').style.display=m==='reg'?'flex':'none';}
$('t-login').onclick=()=>setMode('login');$('t-reg').onclick=()=>setMode('reg');setMode('login');
const errs={
 'auth/invalid-credential':['E-posta veya şifre hatalı.','Wrong email or password.'],
 'auth/email-already-in-use':['Bu e-posta zaten kayıtlı.','This email is already registered.'],
 'auth/weak-password':['Şifre en az 6 karakter olmalı.','Password must be at least 6 characters.'],
 'auth/invalid-email':['Geçersiz e-posta.','Invalid email.'],
 'auth/too-many-requests':['Çok fazla deneme, biraz bekle.','Too many attempts, wait a bit.']};
const em=x=>{const e=errs[x.code];return e?T(e[0],e[1]):T('Hata: ','Error: ')+x.code;};
$('go').onclick=async()=>{
  if(mode==='reg'&&!$('agree').checked){say(T('Devam etmek için onay kutusunu işaretlemelisin.','Please tick the checkbox to continue.'),true);return;}
  try{
    const e=$('email').value.trim(),p=$('pass').value;
    const cred=mode==='login'?await signInWithEmailAndPassword(auth,e,p):await createUserWithEmailAndPassword(auth,e,p);
    const role=await getRole(cred.user);
    location.href=isStaffRole(role)?'panel.html':'duyurular.html';
  }catch(x){say(em(x),true);}
};
$('reset').onclick=async ev=>{ev.preventDefault();
  try{await sendPasswordResetEmail(auth,$('email').value.trim());say(T('Şifre sıfırlama e-postası gönderildi (hesap varsa).','Password reset email sent (if the account exists).'));}
  catch(x){say(em(x),true);}};
document.addEventListener('langchange',()=>setMode(mode));
</script></body></html>
